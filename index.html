<title>La Terra Autisti</title>

<style>
/* Impianto: stesso linguaggio dell'app Presenze, ma con scritte e pulsanti più grandi.
   Tre voci in basso. Ogni servizio ha pulsanti con il nome scritto per esteso; il foglio di servizio è il PDF,
   il foglio del mese è la griglia a crocette del foglio di carta. */
:root{
  --paper:#EEF0EA; --card:#FFFFFF; --ink:#141B18; --ink-soft:#57625D;
  --line:#D5D9CF; --line-strong:#AEB5A8;
  --accent:#1E6F5C; --accent-ink:#FFFFFF; --danger:#A8364A; --rosso:#D9202F;
  --ambra:#8A570C; --ambra-fondo:#C9821F;
  --shadow:0 8px 28px rgba(20,27,24,.16);
  --c-pasti:#A96716; --c-hotel:#35569B; --c-parcheggi:#75569F; --c-carburante:#B0485A; --c-extra:#4A5560;
  --t-tour:#2B7A4B; --t-gita:#8A6A00; --t-transfer:#A34700; --t-notturno:#1B2A5C;
  --foglio:#FFFFFF;
  --tint:14%;
  --sc-1:#2B2F34; --sc-2:#5C636B; --sc-3:#363B41; --sc-giallo:#FFB21A; --sc-rosso:#C0262D; --sc-asfalto:#17191C; --sc-bordo:#3A4046; --sc-tratto:#FFD27F;
  --bus-cassa:#F6F4EF; --bus-fascia:#3A3F45; --bus-vetro:#1D2931; --bus-gomma:#101214; --bus-cerchio:#A7AFB6; --fr-1:#FF7A1A; --fr-2:#F0124A; --fr-3:#7A0F2A;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111614; --card:#1A211E; --ink:#E8EDE9; --ink-soft:#A0ABA5;
    --line:#2C3531; --line-strong:#48544E;
    --accent:#4FB397; --accent-ink:#0B1310; --danger:#E0778A; --rosso:#F0555F;
    --ambra:#E0A44A; --ambra-fondo:#C9821F;
    --shadow:0 8px 28px rgba(0,0,0,.5);
    --c-pasti:#DFA359; --c-hotel:#7EA0E0; --c-parcheggi:#B59BE0; --c-carburante:#D98A94; --c-extra:#9AA7B4;
    --t-tour:#6BCB93; --t-gita:#F5D14A; --t-transfer:#FFB27A; --t-notturno:#B9CCFF;
    --foglio:#FFFFFF;
    --tint:22%;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111614; --card:#1A211E; --ink:#E8EDE9; --ink-soft:#A0ABA5;
  --line:#2C3531; --line-strong:#48544E;
  --accent:#4FB397; --accent-ink:#0B1310; --danger:#E0778A; --rosso:#F0555F;
  --ambra:#E0A44A; --ambra-fondo:#C9821F;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  --c-pasti:#DFA359; --c-hotel:#7EA0E0; --c-parcheggi:#B59BE0; --c-carburante:#D98A94; --c-extra:#9AA7B4;
  --t-tour:#6BCB93; --t-gita:#F5D14A; --t-transfer:#FFB27A; --t-notturno:#B9CCFF;
  --foglio:#FFFFFF;
  --tint:22%;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
  padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* ---------- testata ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:2px solid var(--rosso)}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:11px 10px}
.logo{height:25px;width:auto;display:block;flex:0 0 auto}
.sync{font-size:.76rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;min-width:0}
.sync span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ambra-fondo);display:block;flex:0 0 7px}

/* ---------- sezioni ---------- */
.view{display:none;padding-top:16px}
.view.active{display:block}
h2{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--ink-soft);font-size:.95rem;margin:0 0 16px}
h3.sez{font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:24px 2px 10px}
h3.sez:first-of-type{margin-top:6px}

/* ---------- scheda di un servizio ---------- */
.serv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 15px 14px;margin-bottom:14px}
.serv.corso{border:2px solid var(--accent)}
.sv-alto{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tipo{flex:0 0 auto;font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:7px;
  color:var(--tc);background:color-mix(in srgb,var(--tc) var(--tint),var(--card));border:1px solid color-mix(in srgb,var(--tc) 35%,transparent)}
.stato{flex:0 0 auto;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap;margin-left:auto}
.stato.nuovo{background:var(--rosso);color:#fff}
.stato.corso{background:color-mix(in srgb,var(--accent) 15%,var(--card));color:var(--accent)}
.stato.da{background:color-mix(in srgb,var(--ambra-fondo) 16%,var(--card));color:var(--ambra)}
.stato.fatto{background:color-mix(in srgb,var(--ink) 7%,var(--card));color:var(--ink-soft)}
.sv-date{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.sv-cli{font-weight:600;font-size:1.05rem;margin-bottom:2px}
.sv-iti{font-size:.95rem;color:var(--ink-soft);margin-bottom:4px}
.sv-mezzo{font-size:.88rem;color:var(--ink-soft)}
.sv-btn{display:grid;gap:9px;margin-top:13px}
.serv.nuovo{border:2.5px solid var(--rosso);padding-top:0;overflow:hidden;box-shadow:0 6px 22px color-mix(in srgb,var(--rosso) 22%,transparent)}
.fascia{margin:0 -15px 13px;background:var(--rosso);color:#fff;font-weight:700;font-size:.92rem;letter-spacing:.07em;text-transform:uppercase;padding:10px 15px;text-align:center}
.mini{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:8px;min-height:64px}
.mini:active{background:color-mix(in srgb,var(--ink) 5%,var(--card))}
.mini .md{flex:0 0 48px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.mini .md b{display:block;font-size:1.2rem;font-weight:700;line-height:1.1}
.mini .md i{display:block;font-style:normal;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font-weight:600;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mt i{display:block;font-style:normal;font-size:.86rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .fr{flex:0 0 auto;font-size:1.4rem;line-height:1;color:var(--ink-soft)}
.mini.sotto{margin:-4px 0 12px 22px;width:calc(100% - 22px);min-height:52px;background:var(--paper)}
.ieri-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ieri-c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--paper);padding:13px 8px;min-height:118px;font-weight:600;font-size:1rem;text-align:center}
.ieri-c .box{width:58px;height:58px;border:2px solid var(--ink);border-radius:8px;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:1.6rem;letter-spacing:-.06em;line-height:1}
.ieri-c.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--accent);color:var(--accent-ink);
  border-radius:14px;padding:14px 16px;font-weight:600;font-size:1.06rem;text-align:center;min-height:58px;line-height:1.2}
.btn:active{filter:brightness(.93)}
.btn[disabled]{opacity:.45}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.grande{min-height:66px;font-size:1.14rem}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn .due-righe{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.btn .due-righe small{font-weight:500;font-size:.84rem;color:var(--ink-soft)}
.btn.busta{justify-content:space-between}
.btn.busta .fr{font-size:1.4rem;line-height:1;color:var(--ink-soft)}

.promemoria{background:color-mix(in srgb,var(--ambra-fondo) 14%,var(--card));border:1.5px solid color-mix(in srgb,var(--ambra-fondo) 55%,transparent);border-radius:16px;padding:14px;margin-bottom:16px;display:grid;gap:11px}
.promemoria b{display:block;font-size:1.08rem;font-weight:700}
.promemoria span{display:block;font-size:.95rem;color:var(--ink-soft)}
.empty-state{background:var(--card);border:1px dashed var(--line-strong);border-radius:16px;padding:26px 20px;text-align:center;color:var(--ink-soft)}
.empty-state b{display:block;color:var(--ink);font-size:1.08rem;margin-bottom:6px}

/* ---------- pagina a tutto schermo (foglio o busta) ---------- */
.vista{position:fixed;inset:0;z-index:80;background:var(--paper);display:none;flex-direction:column}
.vista.open{display:flex}
.vista-alto{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.vista-alto .chi{flex:1;min-width:0}
.vista-alto .chi b{display:block;font-size:1.02rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vista-alto .chi span{display:block;font-size:.82rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.indietro{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--card);
  padding:0 14px 0 10px;min-height:48px;font-weight:600;font-size:1rem}
.indietro:active{background:var(--line)}
.indietro i{font-style:normal;font-size:1.4rem;line-height:1;margin-top:-2px}
.quadro{flex:0 0 auto;width:48px;height:48px;border:1.5px solid var(--line-strong);border-radius:12px;display:grid;place-items:center;background:var(--card);font-size:1.3rem;line-height:1}
.quadro:active{background:var(--line)}
.vista-corpo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 22px}
.vista-corpo > .dentro{max-width:720px;margin:0 auto}
.vista-corpo.pdf{padding:10px;background:color-mix(in srgb,var(--ink) 10%,var(--paper))}
.vista-corpo.pdf > .dentro{max-width:none;margin:0}
.pagina{display:block;background:var(--foglio);border:1px solid var(--line-strong);box-shadow:0 4px 20px rgba(20,27,24,.16);height:auto;max-width:none}
.vista-basso{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.vista-basso > .dentro{max-width:720px;margin:0 auto;display:grid;gap:10px}
.vista-basso > .dentro.zoom{grid-template-columns:1fr 1fr}
.vista-basso > .dentro.zoom .pieno{grid-column:1/-1}

/* ---------- riquadri ---------- */
.riq{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.riq h4{margin:0;padding:12px 14px 0;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.intest{padding:10px 14px 14px;font-size:1rem;line-height:1.5}
.intest b{font-weight:600}
.note{font-size:.86rem;color:var(--ink-soft);margin:10px 4px 0;text-align:center}

/* ---------- busta spese ---------- */
.busta{background:var(--card);border:1px solid var(--line-strong);border-radius:18px;padding:15px 16px;margin-bottom:12px;position:relative}
.busta::before{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--rosso)}
.bu-alto{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.bu-n{font-size:.82rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);flex:1}
.bu-l{font-size:.9rem;color:var(--ink-soft)}
.bu-g{font-size:2.4rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:2px 0 10px}
.bu-g.neg{color:var(--danger)}
.conti{display:grid;gap:6px;font-size:.95rem;border-top:1px dashed var(--line-strong);padding-top:10px}
.conti div{display:flex;justify-content:space-between;gap:10px}
.conti span{color:var(--ink-soft)}
.conti b{font-weight:600;white-space:nowrap}
.azioni2{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:16px}
.cat-t{display:flex;align-items:baseline;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.cat-t i{width:10px;height:10px;border-radius:3px;background:var(--cc);display:block;flex:0 0 10px;align-self:center}
.cat-t b{flex:1;font-weight:600;font-size:1rem}
.cat-t span{font-weight:700;font-size:1rem;color:var(--cc)}
.spesa{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);min-height:66px}
.spesa:last-child{border-bottom:none}
.spesa:active{background:color-mix(in srgb,var(--ink) 5%,var(--card))}
.spesa .ft{flex:0 0 46px;width:46px;height:46px;border-radius:9px;background:color-mix(in srgb,var(--cc) var(--tint),var(--card));display:grid;place-items:center;overflow:hidden;color:var(--cc)}
.spesa .ft img{width:100%;height:100%;object-fit:cover;display:block}
.spesa .ft svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.spesa .tx{flex:1;min-width:0}
.spesa .tx b{display:block;font-weight:500;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spesa .tx span{display:block;font-size:.85rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spesa .eu{flex:0 0 auto;text-align:right;font-weight:600}
.spesa .eu small{display:block;font-weight:500;font-size:.78rem;color:var(--ink-soft)}
.campi{padding:12px 14px 14px;display:grid;gap:11px}
.campi.due{grid-template-columns:1fr 1fr}
.campo{display:block;min-width:0}
.campo > span{display:block;font-size:.88rem;color:var(--ink-soft);margin-bottom:5px}
.campo input,.campo textarea{width:100%;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:11px;padding:12px;min-height:52px;font-size:1.05rem}
.campo textarea{min-height:96px;resize:vertical;line-height:1.4}
.totkm{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.95rem;color:var(--ink-soft);padding-top:2px}
.totkm b{color:var(--ink)}
.consegnata{display:flex;align-items:center;gap:9px;justify-content:center;font-weight:600;color:var(--accent);min-height:58px}
.consegnata svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- foglio del mese: la griglia del foglio di carta ---------- */
.mesenav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mesenav .lbl{flex:1;text-align:center;font-weight:700;font-size:1.25rem;letter-spacing:-.02em;text-transform:capitalize}
.come{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:.95rem}
.come .es{flex:0 0 46px;width:46px;height:46px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:1.5rem;background:var(--card)}
.fm{border:1.5px solid var(--ink);border-radius:6px;background:var(--card);margin-bottom:14px}
.fm-r{display:grid;grid-template-columns:46px minmax(0,1fr) repeat(2,76px);border-bottom:1px solid var(--line-strong)}
.fm-r > *{border-right:1px solid var(--line-strong);min-width:0}
.fm-r > *:last-child{border-right:none}
.fm-r > .c-x:nth-child(3){border-left:1.5px solid var(--ink)}
.fm-testa{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:5;background:var(--card);border-bottom:1.5px solid var(--ink);border-radius:5px 5px 0 0}
.fm-testa > *{display:flex;align-items:center;justify-content:center;padding:6px 2px;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;height:62px;text-align:center;line-height:1.2}
.fm-testa .c-s{justify-content:flex-start;padding-left:8px}
.fm-r .c-g{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.fm-r .c-g b{font-size:1.15rem;font-weight:700;line-height:1.1}
.fm-r .c-g i{font-style:normal;font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.fm-r .c-s{display:flex;flex-direction:column;justify-content:center;padding:4px 7px}
.fm-r .c-s b{font-weight:600;font-size:.84rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-r .c-s i{font-style:normal;font-size:.78rem;line-height:1.2;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-r button.c-x{min-height:58px;display:grid;place-items:center;font-weight:700;font-size:1.55rem;line-height:1;letter-spacing:-.06em;color:var(--ink)}
.fm-r button.c-x:active{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.fm-r button.c-x.on{background:color-mix(in srgb,var(--accent) 13%,var(--card))}
.fm-r.dom .c-g{background:color-mix(in srgb,var(--rosso) 12%,var(--card))}
.fm-r.dom .c-g b,.fm-r.dom .c-g i{color:var(--rosso)}
.fm-r.oggi{outline:3px solid var(--accent);outline-offset:-2px;position:relative;z-index:1}
.fm-r.oggi .c-g i{color:var(--accent);font-weight:700}
.fm-r.dopo{opacity:.42}
.fm-r.prima{background:color-mix(in srgb,var(--ink) 5%,var(--card))}
.fm-r.prima button.c-x,.fm-r.dopo button.c-x{cursor:default}
.fm-r.prima button.c-x.on{background:transparent}
.fm-r.oggi button.c-x:not(.on){background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.fm-tot{background:color-mix(in srgb,var(--ink) 6%,var(--card));border-top:1.5px solid var(--ink);border-bottom:none;border-radius:0 0 5px 5px;margin-top:-1px}
.fm-tot > *{display:grid;place-items:center;min-height:50px;font-weight:700;font-size:1.1rem}
.fm-tot .c-s{place-items:center start;padding-left:8px;font-size:.84rem;letter-spacing:.04em;text-transform:uppercase}
.salvato{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.92rem;color:var(--ink-soft);margin:0 0 14px}
.salvato svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- barra in basso ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--paper) 94%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line-strong);
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex}
nav.tabs button{flex:1;padding:11px 4px 12px;font-size:.84rem;font-weight:600;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-height:66px}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{color:var(--accent)}
nav.tabs button.active::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .pall{position:absolute;top:6px;left:calc(50% + 9px);min-width:19px;height:19px;border-radius:10px;background:var(--rosso);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* ---------- foglio dal basso ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(10,14,12,.5);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.scrim.alto{z-index:99}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;visibility:hidden}
.sheet.open{transform:translateY(0);visibility:visible}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:9px auto 4px}
.sheet h3{margin:6px 16px 2px;font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.sheet .who{margin:0 16px 12px;font-size:.9rem;color:var(--ink-soft)}
.sheet .corpo{padding:0 16px;display:grid;gap:13px;max-width:720px;margin:0 auto}
.lett{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}
.lett img{width:64px;height:64px;object-fit:cover;border-radius:9px;flex:0 0 64px;display:block}
.lett .lt{flex:1;min-width:0;font-size:.92rem}
.lett .lt b{display:block;font-weight:600;font-size:1rem}
.lett .lt span{color:var(--ink-soft)}
.lett.ok{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.lett.no{border-color:color-mix(in srgb,var(--ambra-fondo) 50%,transparent);background:color-mix(in srgb,var(--ambra-fondo) 10%,var(--card))}
.giro{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{flex:1 1 auto;border:1.5px solid var(--line-strong);background:var(--paper);border-radius:11px;padding:11px 12px;font-weight:600;font-size:.95rem;min-height:50px;white-space:nowrap}
.chips button.on{background:var(--cc,var(--accent));color:var(--card);border-color:transparent}
.importo{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:14px;padding:6px 14px}
.importo span{font-size:1.5rem;font-weight:600;color:var(--ink-soft)}
.importo input{flex:1;min-width:0;border:none;background:transparent;font-size:2.1rem;font-weight:700;letter-spacing:-.02em;padding:6px 0;min-height:58px;outline:none}
.griglia2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.due button{border-radius:13px;padding:14px;font-weight:600;font-size:1.05rem;min-height:58px}
.due .ann{border:1.5px solid var(--line-strong);background:var(--paper)}
.due .sal{background:var(--accent);color:var(--accent-ink)}
.linkbtn{display:block;margin:2px auto 0;color:var(--danger);font-size:.95rem;text-decoration:underline;padding:10px}

/* ---------- finestra di conferma ---------- */
.modale{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.96);z-index:100;width:min(420px,calc(100vw - 32px));
  background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .16s,transform .16s;max-height:86vh;overflow:auto}
.modale.open{opacity:1;pointer-events:auto;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.modale h3{margin:0 0 8px;font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.modale p{margin:0 0 16px;font-size:1rem;line-height:1.45}
.modale img{display:block;max-width:100%;border-radius:10px;margin:0 auto 14px}
.modale .mb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modale .mb.uno{grid-template-columns:1fr}
.modale .mb button{border-radius:12px;padding:13px;font-weight:600;font-size:1.02rem;min-height:54px}
.modale .mb .ann{border:1.5px solid var(--line-strong);background:var(--paper)}
.modale .mb .sal{background:var(--accent);color:var(--accent-ink)}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:.95rem;font-weight:500;z-index:120;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.profilo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.profilo .nm{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.profilo .rl{font-size:.92rem;color:var(--ink-soft)}
.versione{text-align:center;font-size:.8rem;color:var(--ink-soft);line-height:1.5;margin:22px 0 4px}

/* ---------- pagina di accesso: la scheda dell'Agenda, con la strada e il pullman sotto ---------- */
.gate{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + clamp(16px,6vh,64px)) 16px 170px;
  background:radial-gradient(circle at 12% 14%,color-mix(in srgb,var(--sc-giallo) 30%,transparent),transparent 44%),radial-gradient(circle at 90% 62%,color-mix(in srgb,var(--sc-rosso) 30%,transparent),transparent 48%),linear-gradient(160deg,var(--sc-3),var(--sc-2) 52%,var(--sc-1));
  transition:opacity .35s}
.gate.fine{opacity:0}
.gate-card{position:relative;z-index:2;flex:0 0 auto;width:100%;max-width:440px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);
  animation:sale .6s cubic-bezier(.2,.8,.2,1) both;transition:opacity .3s,transform .35s}
.gate.via .gate-card{opacity:0;transform:translateY(-22px) scale(.97)}
.gate-card.no{animation:scuoti .42s}
.gate-top{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 22px 16px;border-bottom:4px solid var(--sc-giallo)}
.gate-top img{height:44px;width:auto;display:block}
.gate-top b{font-size:.95rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);padding-left:.3em}
.gate-body{padding:20px 22px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.gate-body h2{font-size:1.45rem;margin:0}
.gate-sub{margin:-8px 0 0;color:var(--ink-soft);font-size:.95rem}
.chi-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1.5px solid var(--line-strong);background:var(--paper);border-radius:14px;padding:11px 14px;min-height:66px;font-weight:600;font-size:1.1rem}
.chi-btn:active{background:var(--line)}
.chi-btn .av,.chi-scelto .av{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:1rem;letter-spacing:.02em}
.chi-btn .nm{flex:1;min-width:0}
.chi-btn .fr{font-size:1.4rem;color:var(--ink-soft);line-height:1}
.chi-scelto{display:flex;align-items:center;gap:12px}
.chi-scelto .nm{flex:1;min-width:0;font-weight:700;font-size:1.15rem}
.chi-scelto button{flex:0 0 auto;border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 12px;font-size:.9rem;font-weight:600;min-height:44px}
.pw-campo label{display:block;font-size:.95rem;color:var(--ink-soft);margin-bottom:6px}
.pw-riga{display:flex;gap:8px}
.pw-riga input.nome{letter-spacing:0;font-size:1.15rem}
.pw-riga input{flex:1 1 0;width:0;min-width:0;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:12px;padding:13px 14px;min-height:58px;font-size:1.25rem;letter-spacing:.08em}
.pw-riga button{flex:0 0 auto;border:1.5px solid var(--line-strong);background:var(--card);border-radius:12px;padding:0 14px;font-weight:600;font-size:.95rem;min-width:84px}
.gate-msg{min-height:1.35em;margin:-4px 0;color:var(--danger);font-weight:600;font-size:.95rem}
.resta{display:flex;align-items:center;gap:11px;font-size:1rem;min-height:44px}
.resta input{width:26px;height:26px;flex:0 0 26px;accent-color:var(--accent)}
.gate-prova{background:color-mix(in srgb,var(--ambra-fondo) 13%,var(--card));border:1px dashed color-mix(in srgb,var(--ambra-fondo) 60%,transparent);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--ink)}
.gate-ver{position:relative;z-index:2;flex:0 0 auto;margin:14px 0 0;font-size:.8rem;color:rgba(255,255,255,.72);text-align:center}
.scena{position:absolute;left:0;right:0;bottom:0;height:200px;overflow:hidden;pointer-events:none;z-index:1}
.sfondo{position:absolute;left:0;bottom:44px;width:1600px;height:96px;display:block}
.sfondo.lontano{animation:scorre 70s linear infinite}
.sfondo.vicino{animation:scorre 26s linear infinite}
.strada{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--sc-asfalto);border-top:2px solid var(--sc-bordo)}
.strada::after{content:"";position:absolute;left:0;right:0;top:19px;height:4px;background:repeating-linear-gradient(90deg,var(--sc-tratto) 0 34px,transparent 34px 80px);background-size:80px 4px;animation:tratti .5s linear infinite}
.bus-corsa{position:absolute;left:50%;bottom:17px;width:min(66vw,280px);margin-left:calc(min(66vw,280px) / -2);animation:arriva 1.5s cubic-bezier(.16,.84,.3,1) both}
.bus{display:block;width:100%;height:auto;overflow:visible;animation:sobbalzo .55s ease-in-out infinite alternate}
.bus .ruota{animation:gira .45s linear infinite;transform-box:fill-box;transform-origin:center}
.gate.via .bus-corsa{animation:parte .95s cubic-bezier(.55,0,.9,.45) forwards}
.gate.via .strada::after{animation-duration:.22s}
@keyframes sale{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes scuoti{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes scorre{to{transform:translateX(-800px)}}
@keyframes tratti{to{background-position-x:-80px}}
@keyframes arriva{from{transform:translateX(-85vw)}to{transform:none}}
@keyframes parte{to{transform:translateX(110vw)}}
@keyframes sobbalzo{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
@keyframes gira{to{transform:rotate(360deg)}}

@media (min-width:900px){
  nav.tabs{max-width:720px;left:50%;transform:translateX(-50%);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0}
}
</style>
</head>

const ML=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const gBreve=s=>{const d=dOf(s);return GS[d.getDay()]+" "+d.getDate()+" "+MS[d.getMonth()];};
const gLungo=s=>{const d=dOf(s);return GL[d.getDay()]+" "+d.getDate()+" "+ML[d.getMonth()];};
const maiusc=t=>t.replace(/^./,c=>c.toUpperCase());
const gNum=s=>{const d=dOf(s);return d.getDate()+" "+ML[d.getMonth()];};
const periodo=(a,b)=>!b||a===b?maiusc(gLungo(a)):(a.slice(0,7)===b.slice(0,7)?"Dal "+dOf(a).getDate()+" al "+gNum(b):"Dal "+gNum(a)+" al "+gNum(b));
const eur=n=>"€ "+Number(n||0).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const intero=n=>Number(n||0).toLocaleString("it-IT");
// "12,50" · "12.50" · "1.250,00" → numero (null se non è un numero)
function numero(v){
  let t=String(v==null?"":v).trim().replace(/[€\s]/g,"");if(!t)return null;
  if(t.indexOf(",")>=0)t=t.replace(/\./g,"").replace(",",".");
  const x=parseFloat(t);return isFinite(x)?Math.round(x*100)/100:null;
}
const nuovoId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastT=null;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

function gruppi(){
  const g={nuovi:[],oggi:[],buste:[],prossimi:[],archivio:[]};
  S.servizi.forEach(s=>{const f=fase(s);
    if(f==="concluso")(s.busta&&!s.spese.consegnata?g.buste:g.archivio).push(s);
    else if(!s.visto)g.nuovi.push(s);
    else if(f==="corso")g.oggi.push(s);
    else g.prossimi.push(s);
  });
  const su=(a,b)=>a.dal<b.dal?-1:1;
  g.nuovi.sort(su);g.oggi.sort(su);g.prossimi.sort(su);g.buste.sort(su);g.archivio.sort((a,b)=>a.dal<b.dal?1:-1);
  return g;
}

async function riduci(file,max){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"});}
  catch(_){src=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("img"));im.src=u;});}
  const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  return c;
}
function domanda(s){
  return "Sei il lettore di scontrini di un'azienda italiana di noleggio pullman. L'immagine allegata è la foto di uno scontrino o di una ricevuta fatta da un autista durante un servizio dal "+s.dal+" al "+(s.al||s.dal)+".\n"+
  "Leggi lo scontrino e rispondi SOLO con un oggetto JSON, senza altro testo, con queste chiavi:\n"+
  '{"importo": numero con il punto come separatore decimale (il TOTALE pagato; null se non si legge),\n'+
  ' "data": "AAAA-MM-GG" (la data dello scontrino; null se non si legge),\n'+
  ' "esercente": nome breve del locale o del distributore (null se non si legge),\n'+
  ' "citta": comune dove si trova (null se non si legge),\n'+
  ' "categoria": una tra "pasti", "hotel", "parcheggi", "carburante", "extra",\n'+
  ' "litri": numero di litri se è carburante, altrimenti null,\n'+
  ' "descrizione": due o tre parole su cosa è stato pagato}\n'+
  'Regole: bar, ristoranti, pizzerie e alimentari sono "pasti"; alberghi e tasse di soggiorno sono "hotel"; parcheggi, soste bus, ticket ZTL e checkpoint bus sono "parcheggi"; gasolio, benzina e AdBlue sono "carburante"; pedaggi, traghetti, lavaggi e tutto il resto sono "extra". '+
  "Gli importi italiani usano la virgola per i decimali: 25,00 diventa 25.00. Se l'immagine non è uno scontrino, metti importo null.\n"+
  'Esempio: {"importo": 25.00, "data": "2026-10-05", "esercente": "Parcheggio Templi", "citta": "Agrigento", "categoria": "parcheggi", "litri": null, "descrizione": "sosta bus"}';
}
const CHIAVE_AI="laterra-autisti-chiave-google",DENTRO_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
function chiaveAI(){try{return (localStorage.getItem(CHIAVE_AI)||"").trim();}catch(_){return "";}}
function estraiJson(t){
  t=String(t||"");try{return JSON.parse(t);}catch(_){}
  const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<=a)return null;
  try{return JSON.parse(t.slice(a,b+1));}catch(_){return null;}
}
// fuori da Claude (es. su GitHub): la foto va a Google Gemini con la chiave salvata su questo telefono.
// Si prova il primo modello dell'elenco; se Google risponde che non esiste più, si passa al successivo.
const MODELLI_GEMINI=["gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-3.8-flash"];
async function leggiConChiave(blob,s,chiave){
  let b64;
  try{b64=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(",")[1]);f.onerror=no;f.readAsDataURL(blob);});}catch(_){return {err:"errore"};}
  const corpo=JSON.stringify({contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:b64}},{text:domanda(s)}]}],generationConfig:{responseMimeType:"application/json",temperature:0}});
  for(const modello of MODELLI_GEMINI){
    let r;
    try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+modello+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":chiave},body:corpo});}
    catch(_){return {err:"rete"};}
    if(r.status===404)continue; // modello ritirato: si prova il prossimo
    if(!r.ok){
      let m="";try{m=String(((await r.json()).error||{}).message||"");}catch(_){}
      if(r.status===429)return {err:/quota|billing|credit/i.test(m)?"credito":"rate_limited"};
      if(r.status===400&&/api key/i.test(m))return {err:"chiave"};
      if(r.status===401)return {err:"chiave"};
      if(r.status===403)return {err:/referer|referrer|origin|blocked/i.test(m)?"indirizzo":"permesso"};
      return {err:"errore"};
    }
    let j;try{j=await r.json();}catch(_){return {err:"errore"};}
    const parti=((((j.candidates||[])[0]||{}).content||{}).parts)||[];
    const o=estraiJson(parti.map(x=>(x&&x.text)||"").join(""));
    return o?{ok:o}:{err:"errore"};
  }
  return {err:"errore"};
}
async function leggi(blob,s){
  if(DENTRO_CLAUDE){
    const sample=await lettore();
    const lim=sample?await sample.limits().catch(()=>null):null;
    if(sample&&lim&&lim.images){
      try{return {ok:await sample.json(domanda(s),{images:blob,modelTier:"quick"})};}
      catch(e){return {err:(e&&e.code)||"errore"};}
    }
  }
  const k=chiaveAI();if(!k)return {err:"assente"};
  return leggiConChiave(blob,s,k);
}

async function nuovaFoto(file){

  if(!mod.toccato.mLuogo){const dove=[j.esercente,j.citta].filter(x=>x&&typeof x==="string").join(", ");$("mLuogo").value=(mod.cat==="extra"&&j.descrizione?String(j.descrizione)+(dove?" – "+dove:""):mod.cat==="carburante"?(j.citta||j.esercente||""):dove).slice(0,80);}

const pulisciNome=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();

function provaAccesso(){
  const msg=$("gateMsg"),nome=$("gateNome"),inp=$("gatePwIn"),ora=Date.now();
  if(ora<fermoFino){msg.textContent="Troppi tentativi: aspetta "+Math.ceil((fermoFino-ora)/1000)+" secondi.";return;}

    case "salva-chiave":{const v=$("chiaveIn").value.trim();if(!v){toast("Incolla prima la chiave");return;}
      try{localStorage.setItem(CHIAVE_AI,v);}catch(_){toast("Questo telefono non permette di salvarla");return;}
      renderProfilo();return toast("Chiave salvata: la lettura è attiva");}
    case "togli-chiave":try{localStorage.removeItem(CHIAVE_AI);}catch(_){}renderProfilo();return toast("Chiave tolta");
    case "consegna":{const s=serv(aperto.id),n=s.spese.righe.length,manca=numero(s.spese.kmRientro)==null;
      return chiedi("Consegnare la busta n. "+s.busta+"?",(n?n+(n===1?" spesa":" spese")+" per "+eur(totContanti(s)+totCarta(s)):"Nessuna spesa segnata")+". Rimanenza in busta: <b>"+eur(rimanenza(s))+"</b>."+(manca?"<br><br><b>Mancano i km al rientro.</b> Puoi consegnare lo stesso.":"")+"<br><br>Dopo la consegna non potrai più modificarla.","Consegna","Non ancora",()=>{s.spese.consegnata=new Date().toISOString();salva();renderVista();toast("Consegnata all'ufficio");});}
    case "ricomincia":return chiedi("Rimettere i dati di esempio?","Le spese e le crocette che hai aggiunto in questa prova vengono cancellate.","Rimetti","Annulla",()=>{S=esempio(S.dati);salva();vai("servizi");toast("Dati di esempio ripristinati");setTimeout(chiediIeri,900);});
    case "esci":return chiedi("Vuoi uscire?","Per rientrare dovrai scrivere di nuovo la password.","Esci","Annulla",esci);
    case "gate-entra":return provaAccesso();
    case "gate-mostra":{const inp=$("gatePwIn"),vedi=inp.type==="password";inp.type=vedi?"text":"password";$("gateMostra").textContent=vedi?"Nascondi":"Mostra";return inp.focus();}
    case "modale-si":{const f=modaleSi;chiudiModale();if(f)f();return;}
    case "modale-no":{const f=modaleNo;chiudiModale();if(f)f();return;}
  }
});
$("scrim").addEventListener("click",()=>{if($("modale").classList.contains("open"))chiudiModale();else chiudiSheet();});
$("fotoInput").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)nuovaFoto(f);});
// due tocchi veloci sul foglio: ingrandisce, e al massimo torna alla misura intera
$("vistaCorpo").addEventListener("dblclick",e=>{if(aperto&&aperto.cosa==="foglio"&&e.target.id==="pagina"){aperto.zoom=(aperto.zoom+1)%ZOOM.length;aggZoom();}});
// km e note: si salvano mentre scrivi, senza ridisegnare (il cursore resta dov'è)
$("vistaCorpo").addEventListener("input",e=>{
  if(!aperto)return;const s=serv(aperto.id),id=e.target.id;
  if(id==="kmPartenza"||id==="kmRientro"){s.spese[id]=e.target.value.trim();const k=kmFatti(s);$("kmTot").textContent=k==null?"—":intero(k)+" km";salva();}
  else if(id==="noteBusta"){s.spese.note=e.target.value;salva();}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("modale").classList.contains("open"))chiudiModale();else if($("sheet").classList.contains("open"))chiudiSheet();else if(aperto)chiudiVista();});

// se l'app resta aperta oltre la mezzanotte, al ritorno riparte con il giorno nuovo
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&iso(new Date())!==OGGI)location.reload();});

avvia();
})();
</script>
